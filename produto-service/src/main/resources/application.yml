server:
  port: 8087

spring:
  application:
    name: produto-service
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=produto_db
    username: root
    password: rootpassword
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
