server:
  port: 8082

spring:
  application:
    name: pedido-service
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=pedido_db
    username: root
    password: rootpassword
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

grpc:
  server:
    port: 9090

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
