server:
  port: 8083

spring:
  application:
    name: carrinho-service
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=carrinho_db
    username: root
    password: rootpassword
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

grpc:
  client:
    pedido-service:
      address: 'discovery:///pedido-service'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
